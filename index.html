<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seguimiento BBVA · Tradel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@700&family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: menú lateral azul marino fijo + franja azul con el título de la sección + contenido en tarjetas blancas */
:root{
  --bg:#eef2f8; --panel:#ffffff; --ink:#0d1b2e; --muted:#5a6a80; --line:#d8e0ec; --soft:#f2f5fa;
  --tred:#e4312b; --navy:#072146; --navy-2:#0c2c5a; --navy-ink:#c9d6ea; --brand:#004481; --brand-ink:#ffffff; --accent:#1973b8; --accent-soft:#e1eefa; --aqua:#2dcccd;
  --badge:#f5a623; --badge-ink:#2b1a00; --badge-red:#da3851;
  --ok:#0b7a4b; --ok-bg:#d9f2e6; --warn:#8a5a00; --warn-bg:#fdf0cf; --bad:#c0233c; --bad-bg:#fde1e6;
  --info:#0b5aa6; --info-bg:#dceafa; --org:#a3410b; --org-bg:#fde6d6; --pur:#5b2c8f; --pur-bg:#ece3f8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Nunito Sans","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1424; --panel:#111f36; --ink:#e4ecf7; --muted:#93a4bd; --line:#22385a; --soft:#16284a;
  --tred:#c62a25; --navy:#051530; --navy-2:#0b2348; --navy-ink:#b9c8df; --brand:#0a4a8c; --brand-ink:#ffffff; --accent:#5bb0f0; --accent-soft:#163a63; --aqua:#2dcccd;
  --badge:#f5a623; --badge-ink:#2b1a00; --badge-red:#ff6b81;
  --ok:#6fd6a4; --ok-bg:#123a2a; --warn:#f2c46b; --warn-bg:#3a2e14; --bad:#ff8b9b; --bad-bg:#40182a;
  --info:#8cc4f5; --info-bg:#173357; --org:#f6a878; --org-bg:#3b2416; --pur:#c7a6f2; --pur-bg:#2b2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1424; --panel:#111f36; --ink:#e4ecf7; --muted:#93a4bd; --line:#22385a; --soft:#16284a;
  --tred:#c62a25; --navy:#051530; --navy-2:#0b2348; --navy-ink:#b9c8df; --brand:#0a4a8c; --brand-ink:#ffffff; --accent:#5bb0f0; --accent-soft:#163a63; --aqua:#2dcccd;
  --badge:#f5a623; --badge-ink:#2b1a00; --badge-red:#ff6b81;
  --ok:#6fd6a4; --ok-bg:#123a2a; --warn:#f2c46b; --warn-bg:#3a2e14; --bad:#ff8b9b; --bad-bg:#40182a;
  --info:#8cc4f5; --info-bg:#173357; --org:#f6a878; --org-bg:#3b2416; --pur:#c7a6f2; --pur-bg:#2b2140; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* menú lateral */
.side{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;overflow-y:auto;padding-left:env(safe-area-inset-left,0px)}
.brand{background:var(--tred);color:#fff;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px}
.tlogo{width:100%;height:auto;display:block}
.client{display:flex;align-items:baseline;gap:8px;border-top:1px solid rgba(255,255,255,.35);padding-top:8px}
.client b{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.04em}
.client span{font-size:12px;opacity:.9}
.side nav{display:flex;flex-direction:column;gap:2px;padding:10px 10px;flex:1}
.grp{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-ink);opacity:.6;padding:14px 10px 6px}
.side nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--navy-ink);padding:10px 12px;border-radius:8px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;text-align:left}
.side nav button:hover{background:var(--navy-2);color:#fff}
.side nav button[aria-current="page"]{background:var(--brand);color:#fff;box-shadow:inset 3px 0 0 var(--aqua)}
.ic{width:18px;text-align:center;opacity:.9}
.side nav .lbl{flex:1}
.n{font-family:var(--mono);font-size:11px;font-weight:600;min-width:24px;height:24px;border-radius:12px;display:inline-grid;place-items:center;padding:0 6px;background:var(--navy-2);color:#fff;border:1px solid rgba(255,255,255,.15)}
.n.hot{background:var(--badge);color:var(--badge-ink);border-color:var(--badge)}
.n.red{background:var(--badge-red);color:#fff;border-color:var(--badge-red)}
.n:empty{display:none}
.who{border-top:1px solid rgba(255,255,255,.08);padding:14px 18px 18px;font-size:12px}
.who b{display:block;font-family:var(--display);font-size:16px;color:#fff;margin-top:2px}
/* franja superior */
.content{min-width:0;display:flex;flex-direction:column}
.band{background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:86px}
.band small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.band h1{margin:0;font-family:var(--display);font-weight:900;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.spacer{flex:1}
.sync{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:7px 10px;background:rgba(255,255,255,.08)}
.dot{width:8px;height:8px;border-radius:50%;background:#c9d6ea}
.dot.on{background:var(--aqua)} .dot.err{background:#ff8b9b}
.btn-w{background:#fff;color:var(--brand);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:var(--display)}
.btn-w:hover{background:#e8f1fb}
.btn-w.aq{background:var(--aqua);color:#04223f}
main{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.btn-w:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.side nav button:focus-visible,tr:focus-visible,.seg button:focus-visible{outline:2px solid var(--aqua);outline-offset:1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.search{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.search label.t{font-size:12px;font-weight:700;color:var(--muted);font-family:var(--display)}
.search input[type=search]{flex:1 1 260px;min-width:0;font-size:16px;padding:10px 12px;border-width:1.5px}
.search input[type=search]:focus{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg button.al[aria-pressed="true"]{background:var(--bad);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h2{font-size:15px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800}
.tbl{overflow:auto;max-height:calc(100vh - 110px);overscroll-behavior-x:contain}
.matrix,.tbl table{position:relative}
th{z-index:2}
@media (max-width:860px){.tbl{max-height:calc(100vh - 160px)}}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:700;font-size:12px;color:var(--ink);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--line);font-family:var(--display)}
th.grp-c{background:var(--accent-soft)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
.wide td{white-space:nowrap} .wide td.clip{max-width:320px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td:has(.cp){white-space:nowrap}
.cp{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;font-size:12px;line-height:1;padding:3px 5px;margin-left:6px;cursor:pointer;vertical-align:middle}
.cp:hover{color:var(--accent);border-color:var(--accent)} .cp.ok{color:#fff;background:var(--ok);border-color:var(--ok)}
th .hf{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;margin-left:4px;font-size:11px;border-radius:3px}
th .hf:hover{color:var(--accent);background:var(--accent-soft)}
th .hf.on{color:#fff;background:var(--accent)}
.hfpop{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:10px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:13px}
.hfl{overflow-y:auto;max-height:260px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;padding:4px}
.hfi{display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13px;padding:3px 4px}
.hfi input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
.hfpop input[type=search]{width:100%}
.hfi span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hfbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--accent-soft);font-size:13px;font-weight:600}
.rqm{display:flex;flex-direction:column;gap:6px}
.rqi{display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:14px}
.rqi:hover{border-color:var(--accent);background:var(--accent-soft)}
.rqc{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;font-weight:700}
.rql{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rqchip{display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:4px 6px 4px 12px;font-size:13px}
.rqchip button{border:0;background:none;color:inherit;cursor:pointer;font-weight:700}
.scancta{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;border-left:4px solid var(--aqua)}
#scanRoot{position:fixed;inset:0;z-index:50;background:#000}
.scanov{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scanhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:#fff}
.scanhead .muted{color:#cfe0f5}
.scanvid{position:relative;flex:0 0 auto;height:min(55vh,460px);background:#000;overflow:hidden}
.scanvid video{width:100%;height:100%;object-fit:cover}
.scframe{position:absolute;inset:18% 18%;border:3px solid var(--aqua);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.scflash{position:absolute;inset:0;pointer-events:none}
.scflash.ok{background:rgba(45,204,205,.35)} .scflash.dup{background:rgba(245,166,35,.35)} .scflash.error{background:rgba(218,56,81,.4)}
.scmsg{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}
.sclist{flex:1;overflow-y:auto;background:var(--panel)}
.scit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.scit.ok span{color:var(--ok)} .scit.error span{color:var(--bad)} .scit.wait span,.scit.queued span,.scit.retrying span{color:var(--muted)}
.ffrepbox{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.ffrepbox input{padding:5px 6px}
.qrow td{background:var(--accent-soft);padding:0}
tr.qopen td{background:var(--accent-soft)}
.qp{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;position:sticky;left:0;max-width:min(1060px,calc(100vw - 340px))}
@media (max-width:860px){.qp{max-width:calc(100vw - 40px)}}
.qp input[type=date]{padding:6px 8px;width:auto}
.qd{display:inline-flex;align-items:center;gap:6px;flex-direction:row;font-size:13px;color:var(--ink)}
#pqT,#pqB{flex:none;width:100%}
.gq{position:relative;flex:0 1 360px;min-width:0}
.gq input{width:100%;border:0;border-radius:6px;padding:9px 12px;font-size:14px;background:#fff;color:#0d1b2e}
.gqres{position:absolute;right:0;top:calc(100% + 6px);width:min(560px,92vw);max-height:70vh;overflow-y:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.28);z-index:30;display:flex;flex-direction:column}
.gqi{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:13px}
.gqi:hover{background:var(--accent-soft)}
.gqd{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.gqr{flex-basis:100%;font-size:12px}
@media (max-width:860px){.gq{flex:1 1 100%;order:5}}
.modsw{display:flex;margin:12px 12px 0;border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.modsw button{flex:1;border:0;background:none;color:var(--navy-ink);padding:9px 6px;font-family:var(--display);font-weight:800;font-size:14px;cursor:pointer}
.modsw button[aria-pressed="true"]{background:var(--aqua);color:#04223f}
.volt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.volt.on{background:var(--badge);border-color:var(--badge);color:var(--badge-ink)}
@media (max-width:860px){.modsw{margin:6px 10px}}
.vz{font-family:var(--mono);font-size:12px;white-space:nowrap}
.vz-vencido{color:var(--bad);font-weight:700} .vz-hoy{color:var(--warn);font-weight:700;background:var(--warn-bg);padding:2px 6px;border-radius:4px} .vz-ok{color:var(--muted)}
.corte{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted)}
.corte.c1{background:var(--accent);border-color:var(--accent);color:#fff}
td input.sel,th input#selAll{width:18px;height:18px;accent-color:var(--accent)}
.inlw{display:inline-flex;align-items:center;gap:6px;flex-direction:row;font-size:12px;color:var(--muted)}
.inlw input{width:18px;height:18px;accent-color:var(--accent)}
td input.inl[type=date]{padding:4px 6px;font-size:13px;min-width:130px}
.mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
.clip{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:10px;white-space:nowrap}
.p-ATENDIDO{background:var(--warn-bg);color:var(--warn)}
.p-DESPACHADO{background:var(--info-bg);color:var(--info)}
.p-RETIRADO{background:var(--org-bg);color:var(--org)}
.p-ENTREGADO{background:var(--ok-bg);color:var(--ok)}
.p-FALSO{background:var(--bad-bg);color:var(--bad)}
.p-REPROGRAMADO{background:var(--pur-bg);color:var(--pur)}
.svc{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.svc-ENTREGA{border-color:var(--accent);color:var(--accent)}
.svc-RECOJO{background:var(--badge);border-color:var(--badge);color:var(--badge-ink)} .svc-TRASLADO{background:var(--aqua);border-color:var(--aqua);color:#04223f}
.days{font-family:var(--mono);font-weight:600}
.days.alert{color:var(--bad)} .days.alert::before{content:"● "}
.grid-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;border-top:4px solid var(--accent)}
.tile b{display:block;font-size:26px;font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--brand)}
:root[data-theme="dark"] .tile b{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile b{color:var(--accent)}}
.tile span{font-size:12px;color:var(--muted)}
.tile.red{border-top-color:var(--bad)} .tile.red b{color:var(--bad)}
.tile.aq{border-top-color:var(--aqua)} .tile.or{border-top-color:var(--badge)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix tbody tr{cursor:default}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);max-width:75ch;margin:0}
/* panel de guía */
.scrim{position:fixed;inset:0;background:rgba(4,16,36,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;gap:10px;padding:16px;background:var(--brand);color:#fff}
.dh h3{margin:0;font-size:17px;font-family:var(--mono)}
.dh .btn{background:#fff;color:var(--brand);border:0}
.db{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.df{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
legend{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0 6px;font-family:var(--display)}
details.cost{border:1px solid var(--line);border-radius:10px}
details.cost summary{cursor:pointer;padding:10px 12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-family:var(--display)}
details.cost fieldset{border:0;border-top:1px solid var(--line);border-radius:0}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label input,label select,label textarea{color:var(--ink);font-size:14px;width:100%}
.full{grid-column:1/-1}
.ro{background:var(--soft);border:1px dashed var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:14px;min-height:36px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.costs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.costs div{background:var(--soft);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;z-index:30;font-size:13px;border-left:4px solid var(--aqua)}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden} .prog i{display:block;height:100%;background:var(--accent);width:0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.flow .pill{opacity:.35} .flow .pill.done{opacity:1}
.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;height:auto;top:env(safe-area-inset-top,0px);z-index:6;overflow:visible;padding-right:env(safe-area-inset-right,0px)}
  .brand{flex-direction:row;align-items:center;padding:8px 16px}
  .tlogo{width:200px}
  .client{border-top:0;padding-top:0;flex-direction:column;gap:0}
  .side nav{flex-direction:row;overflow-x:auto;padding:6px 10px;gap:4px}
  .side nav button{white-space:nowrap;font-size:14px;padding:8px 10px}
  .grp,.who,.ic{display:none}
  .band{position:static;min-height:0}
  .band h1{font-size:20px}
}
@media (max-width:640px){fieldset{grid-template-columns:1fr}.costs{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.gate{position:fixed;inset:0;z-index:40;background:var(--navy);display:grid;place-items:center;padding:16px}
.gbox{background:var(--panel);border-radius:12px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gbox h2{margin:0;font-family:var(--display);font-weight:900;color:var(--ink)}
.glogo{background:var(--tred);border-radius:8px;padding:14px}
.logout{background:none;border:0;color:#fff;font-weight:700;padding:0;margin-top:6px;cursor:pointer;font-family:var(--display);font-size:14px;text-decoration:underline}

<script>
"use strict";
// ---------- estado ----------
const ST = { guias:new Map(), cfg:null, view:"pen", filt:{q:"", serv:"", est:"", alert:false}, sort:{k:"fguia",d:-1}, mes:"", limit:300, ffShow:"pend", loaded:false, canWrite:null, wide:false };
try{ ST.mod = localStorage.getItem("bbvaMod")==="AF"?"AF":"INF"; }catch(e){ ST.mod="INF"; }
try{ ST.wide = localStorage.getItem("segWide")==="1"; ST.penWide = localStorage.getItem("penWide")==="1"; ST.facWide = localStorage.getItem("facWide")!=="0"; }catch(e){ ST.facWide=true; }
const TITLES={seg:"Seguimiento",pen:"Pendientes",acu:"Acuses recibidos",rev:"Por revisar (Economato / Mobiliario)",anu:"Guías anuladas",ff:"Falsos fletes",fac:"Por facturar",imp:"Importar data",cfg:"Ajustes"};

const DEFAULT_CFG = { local:2, nacional:5, cierres:[] };
ST.tarif=null; ST.sel=new Set(); ST.preF=""; ST.revF="pend"; ST.pT=""; ST.pB=""; ST.openQ=null; ST.scan=[]; ST.colF={}; ST.hfT=[]; ST.rq=""; ST.rqList=[];
const ESTADOS = ["ATENDIDO","RETIRADO","DESPACHADO","FALSO FLETE","REPROGRAMADO","ENTREGADO"];
const SERVS = ["ENTREGA","RECOJO","TRASLADO"];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cfg = ()=>ST.cfg||DEFAULT_CFG;

// ---------- fechas ----------
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const fmt=s=>{ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const MESES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SET","OCT","NOV","DIC"];
const MES_TXT={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SET:9,SEP:9,OCT:10,NOV:11,DIC:12};

// ---------- reglas de negocio ----------
function estado(g){
  if(g.fent) return "ENTREGADO";
  if(g.ff && g.ff.fecha) return g.ff.reprog ? "REPROGRAMADO" : "FALSO FLETE";
  if(g.manif && g.manif.num) return "DESPACHADO";
  if(g.fret) return "RETIRADO";
  return "ATENDIDO";
}
function dias(g){ if(estado(g)==="ENTREGADO"||!g.fguia) return null; return daysBetween(g.fguia,today()); }
// ---- lead time: horas de oficina (L-V 9-18, sáb 9-12), sin domingos ni feriados ----
const FERIADOS_PE=["2026-01-01","2026-04-02","2026-04-03","2026-05-01","2026-06-07","2026-06-29","2026-07-23","2026-07-28","2026-07-29","2026-08-06","2026-08-30","2026-10-08","2026-11-01","2026-12-08","2026-12-09","2026-12-25",
  "2027-01-01","2027-03-25","2027-03-26","2027-05-01","2027-06-07","2027-06-29","2027-07-23","2027-07-28","2027-07-29","2027-08-06","2027-08-30","2027-10-08","2027-11-01","2027-12-08","2027-12-09","2027-12-25"];
let _ferCache=null,_ferKey="";
function feriados(){ const l=cfg().feriados||FERIADOS_PE, k=l.join(); if(k!==_ferKey){_ferKey=k;_ferCache=new Set(l);} return _ferCache; }
function horario(d){ if(feriados().has(iso(d))) return null; const w=d.getDay(); if(w===0) return null; return w===6?[9,12]:[9,18]; }
function sumarHoras(inicio,horas){
  let cur=new Date(inicio), rem=horas*60;
  for(let i=0;i<400;i++){
    const day=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()), h=horario(day);
    if(h){ const open=new Date(day), close=new Date(day); open.setHours(h[0],0,0,0); close.setHours(h[1],0,0,0);
      const st=cur<open?open:cur; if(st<close){ const av=(close-st)/6e4; if(rem<=av) return new Date(st.getTime()+rem*6e4); rem-=av; } }
    cur=new Date(day.getFullYear(),day.getMonth(),day.getDate()+1);
  }
  return null;
}
function sumarDiasHabiles(fechaIso,n){
  let d=new Date(fechaIso+"T00:00"), k=0;
  while(k<n){ d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); if(horario(d)) k++; }
  const h=horario(d); d.setHours(h?h[1]:18,0,0,0); return d;
}
// Lugar según la dirección de My Gestwin (y la serie cuando la dirección no lo dice)
function lugarDe(dir,grb){
  const d=norm(fixMoji(dir)), p=String(grb||"").toUpperCase().slice(0,4);
  if(!d) return "";
  if(/LURIN/.test(d) && /CLAVELES|PRADERAS/.test(d)) return "ALMACÉN LURÍN";
  if(/PANAMA\s*3626|ZYTRUST|ZITRUST/.test(d)) return "ZYTRUST (PROVEEDOR)";
  if(/\bICA\s*830\b/.test(d)) return "JR. ICA 830 (PROVEEDOR)";
  if(/TECHSOL/.test(d)) return "TECHSOL (PROVEEDOR)";
  if(/PANAMA\s*3055/.test(d)) return /\bMDA\b/.test(d)?"MDA":(/ALMACEN/.test(d)?"SEDE CENTRAL":(p==="TS03"?"MDA":"SEDE CENTRAL"));
  const i=d.lastIndexOf(" OF "); if(i>=0 && d.slice(i+4).trim()) return "OF. "+d.slice(i+4).trim();
  return fixMoji(dir).toUpperCase().replace(/\s+/g," ").trim().slice(0,45);
}
function ruta(g){
  const p=String(g.grb||"").toUpperCase().slice(0,4), rec=g.serv==="RECOJO", tras=g.serv==="TRASLADO";
  let o=g.orig||"", d="";
  if(rec){ d=g.destLugar||""; if(!o) o=g.dest||""; }
  else if(tras){ d=(g.dest&&g.dest!==o)?g.dest:(g.destLugar||g.dest||""); }
  else d=g.dest||g.destLugar||"";
  if(!o){ if(p==="TS01") o="SEDE CENTRAL"; else if(p==="TC01") o="ALMACÉN LURÍN"; }
  if(!d){ if(p==="TS02") d="SEDE CENTRAL"; else if(p==="TC02") d="ALMACÉN LURÍN"; else if(p==="TS03"&&rec) d="MDA"; }
  return {o,d};
}
// Sello sugerido según a dónde llega la carga: oficina → SUBGERENTE, almacén → ALMACEN, MDA → MDA, proveedor → lo escribe la ejecutiva
function recepAuto(g){
  const d=ruta(g).d||"";
  if(/\(PROVEEDOR\)/.test(d)) return "";
  if(/\bMDA\b/.test(d)) return "SELLO MDA";
  if(/ALMAC|SEDE CENTRAL/.test(d)) return "SELLO ALMACEN";
  if(/^OF\./.test(d)) return "SELLO SUBGERENTE";
  return g.serv==="RECOJO"?"SELLO ALMACEN":"SELLO SUBGERENTE";
}
function vence(g){
  if(esAF(g)){ const base=(g.ff&&g.ff.reprog)?g.ff.reprog:g.fguia, L=num(g.lead); return base&&L?sumarDiasHabiles(base,L):null; }
  if(g.plazoExt){ const d=new Date(g.plazoExt); if(!isNaN(d)) return d; }
  if(g.serv==="RECOJO" && g.fret) return sumarDiasHabiles(g.fret, g.terr==="NACIONAL"?(cfg().recNac||5):(cfg().recLocal||3));
  const base=(g.ff&&g.ff.reprog)?g.ff.reprog:g.fguia; if(!base||!g.te) return null;
  const ini=new Date(base+"T00:00"); ini.setHours(g.corte==="1"?11:15,0,0,0);
  return sumarHoras(ini,num(g.te));
}
function venc(g){
  const e=estado(g); if(e==="ENTREGADO"||e==="FALSO FLETE") return null;
  const v=vence(g); if(!v) return null;
  return {v, st: new Date()>v?"vencido":(iso(v)===today()?"hoy":"ok")};
}
function fechaMaxAF(g){ const v=vence(g); return v?iso(v):""; }
function atrasoAF(g){ if(isFF(g)) return 0; const m=fechaMaxAF(g); if(!m||!g.fent) return ""; return daysBetween(m,g.fent); }
function cumpleAF(g){ const a=atrasoAF(g); return a===""?"":(a>0?"X":"OK"); }
function enAlerta(g){ const x=venc(g); return !!x && x.st==="vencido"; }
const fmtDT=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
// ---- área según la serie del GR BBVA ----
const MOB_RX=/\b(SILLAS?|SILLON(ES)?|BANCAS?|REFRIGERADORAS?|FRIGOBAR|MESAS?|ESCRITORIOS?|CREDENZAS?|ARMARIOS?|ESTANTES?|ANAQUEL(ES)?|SOFAS?|CAJONERAS?|LOCKERS?|PIZARRAS?|ENFRIADOR(ES)?|VENTILADOR(ES)?|MICROONDAS|MUEBLES?|BUTACAS?|PERCHEROS?)\b/;
function areaSerie(g){
  const p=String(g.grb||"").toUpperCase().trim().slice(0,2);
  if(p==="TE") return "ECONOMATO";
  if(p==="TA") return "MOBILIARIO";
  if(p==="TC" && MOB_RX.test(norm(g.cont))) return "MOBILIARIO?";
  return "INFORMATICA";
}
// Módulo: lo decide el ALMACÉN de My Gestwin (INFORMATICA → Informática; ECONOMATO / MOBILIARIO → Activo fijo). Se puede cambiar a mano.
function moduloDe(g){
  if(g.modulo) return g.modulo;
  const a=norm(g.area||"");
  if(a) return /ECONOMATO|MOBILIARIO|ACTIVO/.test(a)?"AF":"INF";
  const p=String(g.grb||"").toUpperCase().slice(0,2); return (p==="TE"||p==="TA")?"AF":"INF";
}
const esAF=g=>moduloDe(g)==="AF";
const MOD_NOMBRE={INF:"Informática",AF:"Activo fijo"};
function visible(g){ return !g.anulada && moduloDe(g)===ST.mod; }
function porRevisar(g){ return false; }
async function anularGuia(id,motivo){
  const g=ST.guias.get(id); if(!g) return;
  await DB.putMany([[id,{...g,anulada:{fecha:today(),motivo:motivo||"",por:myName||""}}]]);
  toast(`${g.grt} anulada. Está en la pestaña Anuladas.`);
}
async function restaurarGuia(id){
  const g={...ST.guias.get(id)}; if(!g) return; delete g.anulada; delete g._id;
  await DB.putMany([[id,g]]); toast(`${g.grt} restaurada.`);
}
const num=v=>{ const n=parseFloat(String(v??"").replace(",",".")); return isFinite(n)?n:0; };
const r2=n=>Math.round(Number(n.toFixed(9))*100)/100;
function enPendientes(g){ const e=estado(g); return e!=="ENTREGADO" && e!=="FALSO FLETE"; }
function isFF(g){ return !!(g.ff&&g.ff.fecha&&!g.ff.reprog&&!g.fent); }
function costo(g){
  const peso=num(g.peso), tar=num(g.tar), pri=num(g.pri);
  const rest=Math.max(0,r2(peso-1));
  if(esAF(g)){
    const pvol=g.vol==="SI"?r2(peso*num(g.fvol!=null?g.fvol:35)/100):0, sub=r2(rest+pvol);
    if(isFF(g)){ const lc=g.ti?g.ti==="LC":g.terr!=="NACIONAL"; const cond=g.serv==="ENTREGA"?r2(pri+0.35*rest*tar):(lc?2:8), igv=r2(cond*0.18);
      return {rest,pvol,sub,fxk:0,cond,flete:cond,igv,total:r2(cond+igv),has:g.serv!=="ENTREGA"||!!(g.tar||g.pri)}; }
    const fxk=r2(sub*tar), flete=r2(pri+fxk), igv=r2(flete*0.18);
    return {rest,pvol,sub,fxk,cond:0,flete,igv,total:r2(flete+igv),has:!!(g.tar||g.pri)};
  }
  if(isFF(g)){ // falso flete: solo se cobra COND. FF
    const lc=g.ti?g.ti==="LC":g.terr!=="NACIONAL";
    const cond=g.serv==="ENTREGA"?r2(pri+0.35*rest*tar):(lc?2:8), igv=r2(cond*0.18);
    return {rest,fxk:0,cond,flete:cond,igv,total:r2(cond+igv),has:g.serv!=="ENTREGA"||!!(g.tar||g.pri)};
  }
  const fxk=r2(rest*tar), flete=r2(pri+fxk), igv=r2(flete*0.18);
  return {rest,fxk,cond:0,flete,igv,total:r2(flete+igv), has: !!(g.tar||g.pri)};
}
// ---------- tarifario: completa solo TI, territorio, zona y tarifas por código de oficina ----------
// Códigos que usan la tarifa de otro (904 SEDE CENTRAL = misma tarifa y representante que 479)
const COD_ALIAS={"904":"479"};
const COD_NOMBRE={"904":"SEDE CENTRAL"};
function miniAuto(g){
  if(g.serv!=="TRASLADO") return "NO";
  const r=ruta(g); if(!/^OF\./.test(r.o||"")||!/^OF\./.test(r.d||"")) return "NO";
  const T=ST.tarif, c=String(parseInt(g.co,10)), cod=COD_ALIAS[c]||c;
  return T&&T.mini&&T.mini[cod]?"SI":"NO";
}
const miniEf=g=>g.miniFijo&&g.mini?g.mini:miniAuto(g);
function tarifaAF(g){
  const A=ST.tarifAF; if(!A||!A.cod) return null;
  const c=String(parseInt(g.co,10)); if(c==="NaN") return null;
  const src=A.cod[c]; if(!src) return null;
  const T=ST.tarif, inf=T&&T.tarifas?T.tarifas[COD_ALIAS[c]||c]:null;   // representante: del tarifario de Informática, mismo código
  return {ti:src.via, pri:src.pri, tar:src.tar, lead:src.lead, fvol:src.fvol, ofc:src.ofc, nombre:src.zona, rep:inf?inf.rep:"", oficina:src.nom, te:""};
}
function tarifaDe(g){
  if(esAF(g)) return tarifaAF(g);
  const T=ST.tarif; if(!T||!T.tarifas) return null;
  const c0=String(parseInt(g.co,10)); if(c0==="NaN") return null;
  const cod=COD_ALIAS[c0]||c0;
  const src=(miniEf(g)==="SI" && T.mini && T.mini[cod]) ? T.mini[cod] : T.tarifas[cod];
  if(!src) return null;
  const exp=g.tipo==="EXP";
  return {ti:exp?src.tiE:src.tiR, pri:exp?src.priE:src.priR, tar:exp?src.tarE:src.tarR, te:exp?src.teE:src.teR, ofc:src.ofc, nombre:src.nombre, rep:src.rep, oficina:src.of};
}
function enrich(g){
  const t=tarifaDe(g)||{};
  const ti=t.ti||g.ti||"";
  return {...g, ti, terr: ti ? (ti==="LC"?"LOCAL":"NACIONAL") : (g.terr||""), zona:t.nombre||g.zona||"", ofc:t.ofc||g.ofc||"",

function buscarGuia(texto){
  const up=String(texto||"").toUpperCase(), qn=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  const toks=(up.match(/[A-Z]{2}\d{2}-?\d{6,8}/g)||[]).map(qn); if(!toks.length) toks.push(qn(up));
  for(const tk of toks){ for(const g of ST.guias.values()){ if(qn(g.grt)===tk||qn(g.grb)===tk) return g; } }
  return null;
}
// ---------- Escáner QR SUNAT (mismo flujo que Roche) ----------
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
const QR_CACHE_KEY="bbva_qr_cache_v1", SCAN_KEY="bbva_scan_"+today();
const qrCache=lsGet(QR_CACHE_KEY,{});
const SCAN={items:lsGet(SCAN_KEY,[]), running:0, stream:null, det:null, busy:false, timer:null, lastHash:"", lastAt:0};
SCAN.items.forEach(i=>{ if(["wait","queued","retrying"].includes(i.status)) i.status="queued"; });
const saveScanList=()=>lsSet(SCAN_KEY,SCAN.items.map(({id,hash,gr,status,error,guia,ya})=>({id,hash,gr,status,error,guia,ya})));
function scanHashFrom(text){ const m=String(text||"").trim().match(/[?&]hashqr=([^&\s]+)/i); if(!m) return ""; try{ return decodeURIComponent(m[1]).replace(/ /g,"+"); }catch(e){ return m[1].replace(/ /g,"+"); } }
function guiaPorGR(gr){
  const qn=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,""), k=qn(gr); if(!k) return null;
  for(const g of ST.guias.values()){ if(qn(g.grt)===k) return g; if(String(g.grb||"").toUpperCase().split(/[\s\/,;]+/).some(x=>qn(x)===k)) return g; }
  return null;
}
let audioCtx=null;
function beep(freq,ms,delay=0){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t0=audioCtx.currentTime+delay/1000;
  o.frequency.value=freq; o.type="sine"; g.gain.setValueAtTime(.25,t0); g.gain.exponentialRampToValueAtTime(.001,t0+ms/1000); o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+ms/1000); }catch(e){} }
function scanFeedback(kind){
  if(kind==="ok"){ beep(1046,130); navigator.vibrate?.(80); } else if(kind==="dup"){ beep(520,90); beep(520,90,140); navigator.vibrate?.([60,60,60]); } else { beep(220,350); navigator.vibrate?.([200,80,200]); }
  const f=$("#scFlash"); if(f){ f.className="scflash "+kind; clearTimeout(scanFeedback._t); scanFeedback._t=setTimeout(()=>f.className="scflash",380); }
}
const scMsg=tx=>{ const el=$("#scMsg"); if(el) el.textContent=tx; };
async function aplicarScan(item){
  const g=guiaPorGR(item.gr);
  if(!g){ item.status="error"; item.error="No está en el seguimiento. ¿Ya importaste las guías de ese día?"; scanFeedback("error"); return; }
  item.guia=g.grt;
  if(g.anulada){ item.status="error"; item.error=`Está anulada (${fmt(g.anulada.fecha)})`; scanFeedback("error"); return; }

  if(SCAN.items.some(x=>x!==item&&x.guia===g.grt&&x.status==="ok")){ item.status="error"; item.error="Duplicada: ya la escaneaste"; scanFeedback("dup"); return; }
  item.ya=g.acuse||"";
  if(!g.acuse){ try{ await DB.patch(g._id,{acuse:today()}); }catch(err){ item.status="error"; item.error="No se pudo guardar el acuse"; scanFeedback("error"); return; } }
  item.status="ok"; item.error="";
}
async function lookupScan(item){
  item.status="wait"; renderScanList();
  try{
    let info=qrCache[item.hash];
    if(!info){
      if(!sb) throw new Error("Inicia sesión para consultar SUNAT");
      const {data,error}=await sb.functions.invoke("sunat-gre",{body:{hashqr:item.hash}});
      if(error){ let msg="No se pudo consultar SUNAT"; try{ const j=await error.context?.json?.(); if(j?.error) msg=j.error; }catch(e){}
        if(/not found|404/i.test(String(error.message||""))) msg="Falta instalar la función sunat-gre en Supabase"; throw new Error(msg); }
      if(!data?.ok||!data.gr) throw new Error(data?.error||"SUNAT no devolvió el número de guía");
      info={gr:data.gr}; qrCache[item.hash]=info; lsSet(QR_CACHE_KEY,qrCache);
    }
    item.gr=info.gr;
    await aplicarScan(item);
  }catch(err){
    const msg=err.message||"Error consultando SUNAT";
    if(/no respondi|respondió 5|429|Failed to fetch|network|non-2xx/i.test(msg) && (item.retries||0)<2){
      item.retries=(item.retries||0)+1; item.status="retrying"; setTimeout(()=>{ if(item.status==="retrying"){ item.status="queued"; pumpScan(); } },3000);
    } else { item.status="error"; item.error=msg; scanFeedback("error"); }
  }
  saveScanList(); renderScanList();
}
function pumpScan(){
  const q=SCAN.items.filter(i=>i.status==="queued");
  while(SCAN.running<2 && q.length){ const it=q.shift(); SCAN.running++; lookupScan(it).finally(()=>{ SCAN.running--; pumpScan(); }); }
}
function addScannedHash(hash){
  const ex=SCAN.items.find(i=>i.hash===hash);
  if(ex){ scanFeedback("dup"); scMsg(`Ya escaneada: ${ex.guia||ex.gr||"consultando…"}`); return; }
  const it={id:Date.now()+"-"+Math.random().toString(36).slice(2,6),hash,gr:"",status:"queued",error:""};
  SCAN.items.push(it); saveScanList(); scanFeedback("ok"); scMsg(`Leída (${SCAN.items.length}). Pasa a la siguiente guía`);
  renderScanList(); pumpScan();
}
async function getScanDetector(){
  if("BarcodeDetector" in window){ try{ const f=await window.BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")){ const d=new window.BarcodeDetector({formats:["qr_code"]}); return async src=>(await d.detect(src)).map(x=>x.rawValue); } }catch(e){} }
  if(!window.ZXingWASM){ await new Promise((ok,fail)=>{ const sc=document.createElement("script"); sc.src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"; sc.onload=ok; sc.onerror=()=>fail(new Error("No se pudo cargar el lector de QR")); document.head.appendChild(sc); }); }
  const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
  return async video=>{ const w=video.videoWidth,h=video.videoHeight; if(!w||!h) return []; cv.width=w; cv.height=h; cx.drawImage(video,0,0,w,h);
    const res=await window.ZXingWASM.readBarcodes(cx.getImageData(0,0,w,h),{formats:["QRCode"],tryHarder:false,maxNumberOfSymbols:1}); return res.filter(x=>x.isValid!==false).map(x=>x.text); };
}
async function startScanCamera(){
  if(SCAN.stream) return;
  if(!navigator.mediaDevices?.getUserMedia){ toast("Este navegador no permite usar la cámara. Abre la página publicada (https) en el celular."); return; }
  try{
    $("#scanRoot").hidden=false; renderScanList();
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:1280}},audio:false});
    const v=$("#scVideo"); v.srcObject=SCAN.stream; await v.play();
    scMsg("Cargando lector…"); SCAN.det=await getScanDetector(); scMsg("Apunta al QR de la guía"); beep(1,1); scanLoop(); pumpScan();
  }catch(err){ stopScanCamera(); toast(err.name==="NotAllowedError"?"Permite el acceso a la cámara para escanear.":(err.message||"No se pudo abrir la cámara.")); }
}
function stopScanCamera(){
  clearTimeout(SCAN.timer); SCAN.timer=null;
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
  const v=$("#scVideo"); if(v) v.srcObject=null; $("#scanRoot").hidden=true; render();
}
async function scanLoop(){
  if(!SCAN.stream) return;
  if(!SCAN.busy && SCAN.det){ SCAN.busy=true;
    try{ const vals=await SCAN.det($("#scVideo")); const hash=vals.map(scanHashFrom).find(Boolean), now=Date.now();
      if(hash){ if(hash!==SCAN.lastHash||now-SCAN.lastAt>2500) addScannedHash(hash); SCAN.lastHash=hash; SCAN.lastAt=now; }
      else if(vals.length && now-SCAN.lastAt>2500) scMsg("Ese QR no es de una guía SUNAT");
    }catch(e){}
    SCAN.busy=false; }
  SCAN.timer=setTimeout(scanLoop,120);
}
function renderScanList(){
  const el=$("#scList"); if(!el||$("#scanRoot").hidden) return;
  const ok=SCAN.items.filter(i=>i.status==="ok").length, err=SCAN.items.filter(i=>i.status==="error").length, wait=SCAN.items.length-ok-err;

function dondeEsta(g){
  const m=MOD_NOMBRE[moduloDe(g)]+" · ";
  if(g.anulada) return [m+"Anuladas","anu"];
  if(facturable(g)) return [m+(g.pre?`Por facturar · PRE ${g.pre}`:"Por facturar"),"fac"];
  if(estado(g)==="FALSO FLETE") return [m+"Falsos fletes","ff"];
  return [m+"Pendientes","pen"];
}
function buscarGeneral(q){
  const qn=x=>String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,""), dig=x=>String(x||"").replace(/\D/g,"");
  const k=qn(q), d=dig(q), letras=/[A-Z]/i.test(q);
  if(k.length<3) return [];
  return [...ST.guias.values()].filter(g=>letras?(qn(g.grt).includes(k)||qn(g.grb).includes(k)):(dig(g.grt).endsWith(d)||String(g.grb||"").split(/[\s\/,;]+/).some(x=>dig(x).endsWith(d)))).slice(0,12).map(enrich);
}

  const fw=$("#facWideBtn"); if(fw) fw.onclick=()=>{ ST.facWide=!ST.facWide; try{localStorage.setItem("facWide",ST.facWide?"1":"0");}catch(e){} render(); };
  const wb=$("#wideBtn"); if(wb) wb.onclick=()=>{ ST.wide=!ST.wide; try{localStorage.setItem("segWide",ST.wide?"1":"0");}catch(e){} render(); };
  // importar

  };

    else { const d=new Date(); y=d.getFullYear(); mo=d.getMonth()+1; }
    const last=new Date(y,mo,0); const mes=`${MESES[mo-1]}-${y}`;
    saveCfg({...cfg(),cierres:[...cfg().cierres,{mes,fecha:iso(last),cerrado:false}]},`${mes} agregado con cierre ${fmt(iso(last))}.`);

  const sd=$("#saveDias"); if(sd) sd.onclick=()=>saveCfg({...cfg(),local:num($("#dLocal").value),nacional:num($("#dNac").value)},"Alertas guardadas.");

function dropSetup(dropId,inputId,fn){
  const d=$("#"+dropId), i=$("#"+inputId); if(!d) return;
  i.onchange=()=>{ if(i.files[0]) fn(i.files[0]); i.value=""; };
  d.ondragover=e=>{e.preventDefault();d.classList.add("over");};
  d.ondragleave=()=>d.classList.remove("over");
  d.ondrop=e=>{e.preventDefault();d.classList.remove("over"); const f=e.dataTransfer.files[0]; if(f) fn(f);};
}

function readBook(file){ return file.arrayBuffer().then(b=>XLSX.read(b,{type:"array",cellDates:true})); }
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim();
function toISO(v){
  if(v===null||v===undefined||v==="") return "";
  if(v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime()+12*36e5));
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*864e5)+12*36e5); return iso(d); }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if(m){ let y=+m[3]; if(y<100)y+=2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=norm(s).match(/^(\d{1,2})[\s\-\/]?([A-Z]{3})/); if(m&&MES_TXT[m[2]]){ const now=new Date(); let y=now.getFullYear(); if(MES_TXT[m[2]]>now.getMonth()+1) y--; return `${y}-${pad(MES_TXT[m[2]])}-${pad(m[1])}`; }
  return "";
}

const CP1252={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function fixMoji(v){
  const s=String(v??"");
  if(!/[ÃÂ]/.test(s)) return s.trim();
  const b=[]; for(const ch of s){ let c=ch.codePointAt(0); if(c>255){ if(CP1252[c]===undefined) return s.trim(); c=CP1252[c]; } b.push(c); }
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(new Uint8Array(b)).trim(); }catch(e){ return s.trim(); }
}

          serv:serv.startsWith("RECO")?"RECOJO":serv.startsWith("TRAS")?"TRASLADO":"ENTREGA",co:s(at(col("CO"))),dest:s(at(col("OFICINA",/OFICINA DESTINO/))),

function parseTarifario(wb){

    const name=wb.SheetNames.find(n=>norm(n)===hoja); if(!name) continue;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""});
    const hi=rows.findIndex(r=>(r||[]).map(norm).includes("COD")); if(hi<0) continue;
    const H=rows[hi].map(norm), c=n=>{ const i=H.indexOf(n); return i>=0?i:H.findIndex(h=>h.startsWith(n)); };

}

function toDT(v){
  if(v instanceof Date && !isNaN(v)) return `${iso(v)}T${pad(v.getHours())}:${pad(v.getMinutes())}`;
  const s=String(v??"").trim(); const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}T${pad(m[4])}:${m[5]}`;
  const d=toISO(v); return d?d+"T18:00":"";
}

const chunk=(a,n)=>{ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; };

const DB = {
  // guarda varias guías de una vez (de a 500)
  async putMany(pairs, onProgress){
    let done=0;
    for(const part of chunk(pairs,500)){
      const rows=part.map(([id,d])=>({id, data:clean({...d,updatedAt:Date.now(),updatedBy:myName}), updated_by:myName, updated_at:new Date().toISOString()}));
      const {error}=await sb.from(T_GUIAS).upsert(rows);
      if(error) throw sbErr(error);
      rows.forEach(r=>applyLocal(r.id,r.data)); done+=part.length; if(onProgress) onProgress(done,pairs.length);
    }
    afterData();
  },
  put(id,data){ return DB.putMany([[id,data]]); },
  patch(id,p){ return DB.putMany([[id,{...(ST.guias.get(id)||{}),...p}]]); },
  async del(id){ const {error}=await sb.from(T_GUIAS).delete().eq("id",id); if(error) throw sbErr(error); applyLocal(id,null); afterData(); },

  gate(`<form class="gbox" id="setupF"><div class="glogo">${$(".tlogo").outerHTML}</div><h2>Conectar con Supabase</h2>
    <p class="note">Solo la primera vez en esta computadora. Usa la URL y la clave <b>anon public</b> de tu proyecto (Project Settings → API).</p>
    <label ${SUPABASE_URL?"hidden":""}>Project URL<input id="sUrl" ${SUPABASE_URL?"":"required"} value="${esc(SUPABASE_URL)}" placeholder="https://xxxx.supabase.co"></label>
    <label>Clave anon public (empieza con eyJ…)<input id="sKey" required></label>
    <button class="btn pri" type="submit">Conectar</button></form>`);
  $("#setupF").onsubmit=e=>{ e.preventDefault(); try{ if($("#sUrl").value.trim()) localStorage.setItem("sbUrl",$("#sUrl").value.trim()); localStorage.setItem("sbKey",$("#sKey").value.trim()); }catch(err){} start(); };
}
function showLogin(msg){
  gate(`<form class="gbox" id="loginF"><div class="glogo">${$(".tlogo").outerHTML}</div><h2>Seguimiento BBVA</h2>
    <label>Correo<input id="lMail" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit" id="lBtn">Ingresar</button><p class="note" id="lMsg" style="color:var(--bad)">${esc(msg||"")}</p></form>`);
  $("#lMail").focus();
  $("#loginF").onsubmit=async e=>{ e.preventDefault(); $("#lBtn").disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$("#lMail").value.trim(),password:$("#lPass").value});
    if(error){ $("#lBtn").disabled=false; $("#lMsg").textContent="Correo o contraseña incorrectos."; return; }
    start(); };
}
async function start(){
  const {url,key}=conf();
  if(!url||!key){ showSetup(); return; }
  if(!sb) sb=supabase.createClient(url,key);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  const u=session.user; myName=(u.user_metadata&&(u.user_metadata.nombre||u.user_metadata.name))||(u.email||"").split("@")[0];
  $("#whoName").textContent=myName; gate("");
  await loadAll();
}
$("#logout").onclick=async()=>{ if(sb) await sb.auth.signOut(); location.reload(); };
start();
</script>
</body>
</html>
